name: Release theme

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 发布只用 gh/API，不需要 git 推送；不把可写 token 留在 .git/config 给依赖安装脚本。
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and theme version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build and validate
        run: |
          pnpm build
          pnpm test
          pnpm test:budget

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES_FILE="$(mktemp)"
          node scripts/extract-changelog.mjs "${VERSION}" > "${NOTES_FILE}"
          ASSET="dist/theme-rackora-${VERSION}.zip"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "Rackora v${VERSION}" --notes-file "${NOTES_FILE}"
            gh release upload "v${VERSION}" "${ASSET}" --clobber
          else
            gh release create "v${VERSION}" "${ASSET}" \
              --title "Rackora v${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi
          echo "id=$(gh release view "v${VERSION}" --json databaseId --jq .databaseId)" >> "${GITHUB_OUTPUT}"

      # 应用市场首次审核通过后，在仓库 Settings → Secrets and variables → Actions 中配置
      # 变量 HALO_APP_ID 和密钥 HALO_PAT，后续版本即自动同步；未配置时只发布 GitHub Release。
      # 密钥只交给这两个步骤，不放进 job 级 env，避免依赖安装脚本读到。
      - name: Check Halo App Store configuration
        id: appstore
        env:
          HALO_APP_ID: ${{ vars.HALO_APP_ID }}
          HALO_PAT: ${{ secrets.HALO_PAT }}
        shell: bash
        run: |
          if [ -n "${HALO_APP_ID}" ] && [ -n "${HALO_PAT}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Halo App Store sync skipped: configure the HALO_APP_ID variable and HALO_PAT secret after the first review is approved."
          fi

      # 该 action 会拿到 HALO_PAT 与可写 token，固定到已审查的提交，升级时复核源码再改 SHA。
      - name: Sync release to Halo App Store
        if: steps.appstore.outputs.enabled == 'true'
        uses: halo-sigs/reusable-workflows/app-store-release-action@045a5dd72c61775ea923c0a3a58576f680143430 # v5.0.1
        with:
          github-token: ${{ github.token }}
          app-id: ${{ vars.HALO_APP_ID }}
          release-id: ${{ steps.release.outputs.id }}
          assets-dir: dist
          halo-pat: ${{ secrets.HALO_PAT }}
          sync-github-readme: ${{ vars.HALO_SYNC_GITHUB_README == 'true' }}
